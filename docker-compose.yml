services:
  db:
    image: postgres:18-alpine
    container_name: hapi_db
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: hapi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/hapi

volumes:
  postgres_data:
